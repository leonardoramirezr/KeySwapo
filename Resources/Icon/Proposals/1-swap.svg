      <feOffset dy="6" result="blur"/>
      <feFlood flood-color="#0B2A6B" flood-opacity="0.22"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="key">
      <path d="M89.63 42.52L146.37 42.52C170.14 42.52 182.03 42.52 192.74 46.06L194.82 46.57C208.79 51.65 219.79 62.65 224.87 76.62C228.92 89.41 228.92 101.3 228.92 125.07L228.92 181.81C228.92 205.58 228.92 217.47 225.38 228.18L224.87 230.26C219.79 244.23 208.79 255.23 194.82 260.31C182.03 264.36 170.14 264.36 146.37 264.36L89.63 264.36C65.86 264.36 53.97 264.36 43.26 260.82L41.18 260.31C27.21 255.23 16.21 244.23 11.13 230.26C7.08 217.47 7.08 205.58 7.08 181.81L7.08 125.07C7.08 101.3 7.08 89.41 10.62 78.7L11.13 76.62C16.21 62.65 27.21 51.65 41.18 46.57C53.97 42.52 65.86 42.52 89.63 42.52Z" fill="#0B2A6B" opacity="0.45" filter="url(#keyShadow)"/>
      <path d="M82.55 26L153.45 26C177.22 26 189.11 26 199.82 29.54L201.9 30.05C215.87 35.13 226.87 46.13 231.95 60.1C236 72.89 236 84.78 236 108.55L236 179.45C236 203.22 236 215.11 232.46 225.82L231.95 227.9C226.87 241.87 215.87 252.87 201.9 257.95C189.11 262 177.22 262 153.45 262L82.55 262C58.78 262 46.89 262 36.18 258.46L34.1 257.95C20.13 252.87 9.13 241.87 4.05 227.9C0 215.11 0 203.22 0 179.45L0 108.55C0 84.78 0 72.89 3.54 62.18L4.05 60.1C9.13 46.13 20.13 35.13 34.1 30.05C46.89 26 58.78 26 82.55 26Z" fill="url(#keySide)"/>
      <path d="M82.55 0L153.45 0C177.22 0 189.11 0 199.82 3.54L201.9 4.05C215.87 9.13 226.87 20.13 231.95 34.1C236 46.89 236 58.78 236 82.55L236 153.45C236 177.22 236 189.11 232.46 199.82L231.95 201.9C226.87 215.87 215.87 226.87 201.9 231.95C189.11 236 177.22 236 153.45 236L82.55 236C58.78 236 46.89 236 36.18 232.46L34.1 231.95C20.13 226.87 9.13 215.87 4.05 201.9C0 189.11 0 177.22 0 153.45L0 82.55C0 58.78 0 46.89 3.54 36.18L4.05 34.1C9.13 20.13 20.13 9.13 34.1 4.05C46.89 0 58.78 0 82.55 0Z" fill="url(#keyFace)"/>
    </g>
  </defs>
  <use href="#shape" fill="url(#bg)" filter="url(#bodyShadow)"/>
  <g clip-path="url(#clip)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
  </g>
  <use href="#shape" fill="none" stroke="url(#rim)" stroke-width="6" clip-path="url(#clip)"/>
  <!-- Arrows: | goes to the right, _ comes back to the left -->
  <g fill="#fff" stroke="#fff" stroke-linejoin="round" filter="url(#arrowShadow)">
    <path d="M238.93 327.37A322 322 0 0 1 751.96 283.28" fill="none" stroke-width="34" stroke-linecap="round"/>
    <path d="M785.07 327.37L685.98 290.63L765.43 223.53Z" stroke-width="14"/>
    <path d="M785.07 668.63A322 322 0 0 1 272.04 712.72" fill="none" stroke-width="34" stroke-linecap="round"/>
    <path d="M238.93 668.63L338.02 705.37L258.57 772.47Z" stroke-width="14"/>
  </g>
  <!-- Keys -->
  <use href="#key" x="222" y="368"/>
  <path d="M327 424L327 548A13 13 0 0 0 353 548L353 424A13 13 0 0 0 327 424Z" fill="#2B3140"/>
  <use href="#key" x="566" y="368"/>
