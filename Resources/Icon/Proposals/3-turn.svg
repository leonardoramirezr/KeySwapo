<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- KeySwapo icon proposal 3, Turn: the | falls over and becomes _. -->
  <defs>
    <path id="shape" d="M383.41 100L640.59 100C722.19 100 763 100 799.79 112.14L806.92 113.89C854.88 131.34 892.66 169.12 910.11 217.08C924 261 924 301.81 924 383.41L924 640.59C924 722.19 924 763 911.86 799.79L910.11 806.92C892.66 854.88 854.88 892.66 806.92 910.11C763 924 722.19 924 640.59 924L383.41 924C301.81 924 261 924 224.21 911.86L217.08 910.11C169.12 892.66 131.34 854.88 113.89 806.92C100 763 100 722.19 100 640.59L100 383.41C100 301.81 100 261 112.14 224.21L113.89 217.08C131.34 169.12 169.12 131.34 217.08 113.89C261 100 301.81 100 383.41 100Z"/>
    <clipPath id="clip"><use href="#shape"/></clipPath>
    <filter id="bodyShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A6273"/>
      <stop offset="1" stop-color="#15171D"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#343946"/>
      <stop offset="1" stop-color="#23262F"/>
    </linearGradient>
    <linearGradient id="faceEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="0.2" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#64F0FF"/>
      <stop offset="1" stop-color="#3CE889"/>
    </linearGradient>
    <linearGradient id="accentArc" x1="318" y1="232" x2="792" y2="706" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#64F0FF"/>
      <stop offset="1" stop-color="#3CE889"/>
    </linearGradient>
    <filter id="glowBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <use href="#shape" fill="url(#bg)" filter="url(#bodyShadow)"/>
  <use href="#shape" fill="none" stroke="url(#rim)" stroke-width="6" clip-path="url(#clip)"/>
  <!-- The icon is a big key seen from above: this is its top face -->
  <path d="M397.3 168L626.7 168C692.73 168 725.74 168 755.51 177.82L761.28 179.24C800.08 193.36 830.64 223.92 844.76 262.72C856 298.26 856 331.27 856 397.3L856 626.7C856 692.73 856 725.74 846.18 755.51L844.76 761.28C830.64 800.08 800.08 830.64 761.28 844.76C725.74 856 692.73 856 626.7 856L397.3 856C331.27 856 298.26 856 268.49 846.18L262.72 844.76C223.92 830.64 193.36 800.08 179.24 761.28C168 725.74 168 692.73 168 626.7L168 397.3C168 331.27 168 298.26 177.82 268.49L179.24 262.72C193.36 223.92 223.92 193.36 262.72 179.24C298.26 168 331.27 168 397.3 168Z" fill="url(#face)"/>
  <path d="M397.3 168L626.7 168C692.73 168 725.74 168 755.51 177.82L761.28 179.24C800.08 193.36 830.64 223.92 844.76 262.72C856 298.26 856 331.27 856 397.3L856 626.7C856 692.73 856 725.74 846.18 755.51L844.76 761.28C830.64 800.08 800.08 830.64 761.28 844.76C725.74 856 692.73 856 626.7 856L397.3 856C331.27 856 298.26 856 268.49 846.18L262.72 844.76C223.92 830.64 193.36 800.08 179.24 761.28C168 725.74 168 692.73 168 626.7L168 397.3C168 331.27 168 298.26 177.82 268.49L179.24 262.72C193.36 223.92 223.92 193.36 262.72 179.24C298.26 168 331.27 168 397.3 168Z" fill="none" stroke="url(#faceEdge)" stroke-width="4"/>
  <!-- Rotation arrow -->
  <g fill="url(#accentArc)" stroke="url(#accentArc)" stroke-linejoin="round">
    <path d="M383.97 236.61A474 474 0 0 1 783.85 618.47" fill="none" stroke-width="22" stroke-linecap="round" stroke-dasharray="0.1 44" opacity="0.9"/>
    <path d="M789.4 656.45L741 599.91L815.87 586.89Z" stroke-width="10"/>
  </g>
  <!-- | falling over -->
  <g>
    <path d="M415.84 556.03L496.97 360.16A33 33 0 0 0 435.99 334.91L354.86 530.77A33 33 0 0 0 415.84 556.03Z" fill="#FFFFFF" opacity="0.16"/>
    <path d="M465.79 604.88L615.69 454.98A33 33 0 0 0 569.02 408.31L419.12 558.21A33 33 0 0 0 465.79 604.88Z" fill="#C9FBEA" opacity="0.28"/>
    <path d="M493.23 669.14L689.09 588.01A33 33 0 0 0 663.84 527.03L467.97 608.16A33 33 0 0 0 493.23 669.14Z" fill="#8FF3D2" opacity="0.42"/>
  </g>
  <path d="M285 318L285 706A33 33 0 0 0 351 706L351 318A33 33 0 0 0 285 318Z" fill="#fff"/>
  <path d="M318 739L706 739A33 33 0 0 0 706 673L318 673A33 33 0 0 0 318 739Z" fill="#3CE889" opacity="0.7" filter="url(#glowBlur)"/>
  <path d="M318 739L706 739A33 33 0 0 0 706 673L318 673A33 33 0 0 0 318 739Z" fill="url(#accent)"/>
</svg>
