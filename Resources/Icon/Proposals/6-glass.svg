      <stop offset="1" stop-color="#5CE1FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="glassEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.15"/>
      <stop offset="0.7" stop-color="#fff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.7"/>
    </linearGradient>
    <clipPath id="clipB"><path d="M612.64 464L687.36 464C727.86 464 748.11 464 766.37 470.03L769.9 470.89C793.7 479.55 812.45 498.3 821.11 522.1C828 543.89 828 564.14 828 604.64L828 679.36C828 719.86 828 740.11 821.97 758.37L821.11 761.9C812.45 785.7 793.7 804.45 769.9 813.11C748.11 820 727.86 820 687.36 820L612.64 820C572.14 820 551.89 820 533.63 813.97L530.1 813.11C506.3 804.45 487.55 785.7 478.89 761.9C472 740.11 472 719.86 472 679.36L472 604.64C472 564.14 472 543.89 478.03 525.63L478.89 522.1C487.55 498.3 506.3 479.55 530.1 470.89C551.89 464 572.14 464 612.64 464Z"/></clipPath>
