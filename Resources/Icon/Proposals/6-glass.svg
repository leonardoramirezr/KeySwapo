    </filter>
    <filter id="glassShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="24"/>
      <feOffset dy="22" result="blur"/>
      <feFlood flood-color="#2A0E6B" flood-opacity="0.28"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glyphShadow" x="-30%" y="-30%" width="160%" height="170%">
