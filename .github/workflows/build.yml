name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          sw_vers
          xcrun swiftc --version

      - name: Core tests
        run: make test

      - name: Build app
        run: make build

      - name: Check example configurations
        run: |
          for file in examples/*.json; do
            build/KeySwapo.app/Contents/MacOS/KeySwapo --check "$file"
          done

      - name: Check the default rule with the Latin American layout
        run: |
          output=$(build/KeySwapo.app/Contents/MacOS/KeySwapo --check examples/pipe-to-underscore.json --layout com.apple.keylayout.LatinAmerican)
          echo "$output"
          grep -qF "grave_accent_and_tilde «|»  →  shift + slash «_»" <<< "$output"
          grep -qF "shift + slash «_»  →  grave_accent_and_tilde «|»" <<< "$output"

      - name: Package
        if: matrix.os == 'macos-15'
        run: ditto -c -k --keepParent build/KeySwapo.app build/KeySwapo.zip

      - uses: actions/upload-artifact@v7
        if: matrix.os == 'macos-15'
        with:
          path: build/KeySwapo.zip
          archive: false
